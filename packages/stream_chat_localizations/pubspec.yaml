name: stream_chat_localizations
description: The Official localizations for Stream Chat Flutter, a service for building chat applications
version: 10.6.0
homepage: https://github.com/GetStream/stream-chat-flutter
repository: https://github.com/GetStream/stream-chat-flutter
issue_tracker: https://github.com/GetStream/stream-chat-flutter/issues

# Note: The environment configuration and dependency versions are managed by Melos.
#
# Do not edit them manually.
#
# Steps to update dependencies:
#   1. Modify the version in the melos.yaml file.
#   2. Run `melos bootstrap` to apply changes.
#
# Steps to add a new dependency:
#   1. Add the dependency to this list.
#   2. Add it to the melos.yaml file for future updates.

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  stream_chat_flutter: ^10.6.0

dev_dependencies:
  clock: ^1.1.2
  flutter_test:
    sdk: flutter

dependency_overrides:
  # stream_core_flutter at its git ref needs a stream_core newer than the
  # published one, so stream_core comes from the same ref.
  stream_core:
    git:
      url: https://github.com/GetStream/stream-core-flutter.git
      ref: 9c8779f27d1a7fc96f30b5baa6794d72b2b76757
      path: packages/stream_core
