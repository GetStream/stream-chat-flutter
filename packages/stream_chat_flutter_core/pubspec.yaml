name: stream_chat_flutter_core
homepage: https://github.com/GetStream/stream-chat-flutter
description: Stream Chat official Flutter SDK Core. Build your own chat experience using Dart and Flutter.
version: 10.7.0
repository: https://github.com/GetStream/stream-chat-flutter
issue_tracker: https://github.com/GetStream/stream-chat-flutter/issues

# Note: The environment configuration and dependency versions are managed by Melos.
#
# Do not edit them manually.
#
# Steps to update dependencies:
#   1. Modify the version in the melos.yaml file.
#   2. Run `melos bootstrap` to apply changes.
#
# Steps to add a new dependency:
#   1. Add the dependency to this list.
#   2. Add it to the melos.yaml file for future updates.

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.1.1
  device_info_plus: ">=12.4.0 <14.0.0"
  flutter:
    sdk: flutter
  freezed_annotation: ^3.0.0
  meta: ^1.9.1
  package_info_plus: ">=9.0.1 <11.0.0"
  rate_limiter: ^1.1.0
  rxdart: ^0.28.0
  stream_chat: ^10.7.0
  stream_core:
    # The ignore below silences `invalid_dependency` because stream_core is
    # pinned to a git ref until the fix in GetStream/stream-core-flutter#254
    # is released.
    #
    # **Note:** Before publishing stream_chat_flutter_core, this MUST be
    # swapped back to a pub version constraint — git deps are not allowed on
    # pub.dev and will block the release.
    # ignore: invalid_dependency
    git:
      url: https://github.com/GetStream/stream-core-flutter.git
      ref: 340e010f186c5fc221b31d8e9b4102ba1530a2ef
      path: packages/stream_core

dev_dependencies:
  build_runner: ^2.15.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  mocktail: ^1.0.5

