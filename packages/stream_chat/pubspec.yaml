name: stream_chat
homepage: https://getstream.io/
description: The official Dart client for Stream Chat, a service for building chat applications.
version: 10.3.0
repository: https://github.com/GetStream/stream-chat-flutter
issue_tracker: https://github.com/GetStream/stream-chat-flutter/issues

# Note: The environment configuration and dependency versions are managed by Melos.
#
# Do not edit them manually.
#
# Steps to update dependencies:
#   1. Modify the version in the melos.yaml file.
#   2. Run `melos bootstrap` to apply changes.
#
# Steps to add a new dependency:
#   1. Add the dependency to this list.
#   2. Add it to the melos.yaml file for future updates.

environment:
  sdk: ^3.12.0

dependencies:
  async: ^2.13.1
  collection: ^1.19.1
  diacritic: ^0.1.6
  dio: ^5.11.0
  equatable: ^2.0.8
  freezed_annotation: ^3.0.0
  http_parser: ^4.1.2
  jose: ^0.3.5+1
  json_annotation: ^4.12.0
  logging: ^1.3.0
  meta: ^1.9.1
  mime: ^2.0.0
  rate_limiter: ^1.1.0
  retrofit: ^4.9.2
  rxdart: ^0.28.0
  stream_core:
    # The ignore below silences `invalid_dependency` because we occasionally
    # pin stream_core to a git ref to iterate on it alongside this
    # SDK between its releases.
    #
    # **Note:** Before publishing stream_chat, this MUST be swapped
    # back to a pub version constraint — git deps are not allowed on pub.dev
    # and will block the release.
    # ignore: invalid_dependency
    git:
      url: https://github.com/GetStream/stream-core-flutter.git
      ref: f83b5d4d706a79fc429de2d27aead4394b83c1fb
      path: packages/stream_core
  synchronized: ^3.4.0
  uuid: ^4.5.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: ^2.15.0
  freezed: ^3.0.0
  json_serializable: ^6.13.2
  mocktail: ^1.0.5
  retrofit_generator: ^10.2.6
  test: ^1.31.1
