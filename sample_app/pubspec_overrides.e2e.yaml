# Copied over pubspec_overrides.yaml by the e2e CI jobs BEFORE `melos bootstrap`
# (melos merges its own managed overrides into the existing file, preserving these
# entries). Swaps the Firebase plugins for the pure-Dart no-op stubs in
# e2e_stubs/ so no native Firebase SDK is downloaded, compiled, or
# initialized during e2e runs.
dependency_overrides:
  firebase_core:
    path: e2e_stubs/firebase_core
  firebase_crashlytics:
    path: e2e_stubs/firebase_crashlytics
  firebase_messaging:
    path: e2e_stubs/firebase_messaging

  # TODO(e2e): temporary — remove this pin once the e2e suite no longer depends
  # on animation frame timing.
  #
  # lottie 3.6.1 schedules frames at the composition frame rate instead of every
  # vsync, which changes when the widget tree goes quiescent. The harness settles
  # the tree between acting on it, so the splash screen's animation shifted when
  # settling completed and the suite began failing across every branch. The SDK
  # itself is compatible with 3.6.1, so this is pinned for e2e only rather than
  # capped in melos.yaml, which would constrain integrators.
  lottie: 3.5.1
