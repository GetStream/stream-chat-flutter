name: SDK Size Report
description: "Downloads the sdk_size results and reports them with the fastlane `sdk_size` lane in metrics/sdk_size."

inputs:
  client-id:
    description: "Client ID of the stream-flutter-ci-bot GitHub App."
    required: true
  private-key:
    description: "Private key of the stream-flutter-ci-bot GitHub App."
    required: true

runs:
  using: "composite"
  steps:
    - name: 📥 Download results
      uses: actions/download-artifact@v8
      with:
        pattern: sdk-size-results-*
        path: build/sdk_size/results
        merge-multiple: true

    # A token that only lives for this job: it reads and pushes
    # stream-internal-metrics, and posts the PR comments.
    - name: 🔑 Create bot token
      id: bot-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        repositories: ${{ github.event.repository.name }},stream-internal-metrics
        permission-contents: write
        permission-pull-requests: write

    - name: 💎 Set up Ruby
      uses: ./.github/actions/setup-ruby
      with:
        working-directory: metrics/sdk_size

    - name: 🔧 Configure Git
      shell: bash
      run: |
        git config --global user.name "Stream Bot"
        git config --global user.email "ci@getstream.io"

    - name: 📏 Report sizes
      shell: bash
      working-directory: metrics/sdk_size
      env:
        GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
      run: bundle exec fastlane sdk_size
