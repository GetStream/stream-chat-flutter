name: 'Install Android NDK'
description: 'Install the NDK and CMake that Flutter plugins build native code with'
runs:
  using: "composite"
  steps:
    - name: Install the NDK and CMake
      shell: bash
      run: |
        # Plugins with native code (e.g. `jni`, used by `path_provider_android`)
        # otherwise make Gradle download these mid-build. Needs Flutter set up.
        #
        # The NDK Flutter sets for plugins (`flutter.ndkVersion`), read from the
        # installed Flutter so an upgrade keeps it in step.
        ndk=$(grep -oP 'ndkVersion: String = "\K[0-9.]+' \
          "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" || true)
        if [ -z "$ndk" ]; then
          echo "::error::Could not read flutter.ndkVersion from the Flutter SDK"
          exit 1
        fi

        # The CMake version the Android Gradle Plugin builds native code with.
        cmake=3.22.1
        # By full path, so the runner's own SDK is the one updated.
        sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$sdkmanager" ]; then
          echo "::error::sdkmanager not found at $sdkmanager"
          exit 1
        fi
        ndk_dir="$ANDROID_HOME/ndk/$ndk"
        installed() {
          [ -f "$ndk_dir/source.properties" ] && [ -x "$ANDROID_HOME/cmake/$cmake/bin/cmake" ]
        }

        # sdkmanager unpacks the download itself. Gradle's own NDK download can
        # arrive corrupt ("Archive is not a ZIP archive"), and then every retry
        # of the build reuses the broken copy.
        # A stalled sdkmanager fails its attempt instead of holding the job; three
        # 5-minute attempts stay inside the 30-minute build job.
        for attempt in 1 2 3; do
          installed && break
          if [ "$attempt" -gt 1 ]; then
            echo "::warning::Installing NDK $ndk and CMake $cmake failed; retrying (attempt $attempt)"
            rm -rf "$ndk_dir" "$ANDROID_HOME/cmake/$cmake" "$ANDROID_HOME/.temp"
            sleep 15
          fi
          yes | timeout 300 "$sdkmanager" --install "ndk;$ndk" "cmake;$cmake" > "$RUNNER_TEMP/sdkmanager.log" 2>&1 || true
        done

        if ! installed; then
          tail -n 30 "$RUNNER_TEMP/sdkmanager.log"
          echo "::error::Could not install NDK $ndk and CMake $cmake"
          exit 1
        fi
        echo "Installed NDK $ndk and CMake $cmake"
