name: 'Setup Melos'
description: 'Activate the melos version pinned in pubspec.lock and resolve the workspace root.'
runs:
  using: "composite"
  steps:
    # The root package holds the tools that melos scripts run, like the
    # bootstrap hook's tools/generate_version.dart, so it is resolved too.
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        version=$(awk '/^  melos:/ { found = 1 } found && /version:/ { gsub(/"/, "", $2); print $2; exit }' pubspec.lock)
        flutter pub global activate melos "$version"
        dart pub get
