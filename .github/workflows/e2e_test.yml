name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      android:
        description: "Run Android e2e tests"
        type: boolean
        default: true
      ios:
        description: "Run iOS e2e tests"
        type: boolean
        default: false
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_PR_NUM: ${{ github.event.pull_request.number }}

jobs:
  select:
    # Pull requests run the tests their changes can reach, per the nightly coverage map.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # downloads the e2e-coverage-map artifact
    outputs:
      e2e_batches: ${{ steps.select.outputs.e2e_batches }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the pull request merge commit and its base

      - uses: ./.github/actions/setup-ruby
        with:
          working-directory: e2e_app

      - name: Select e2e tests
        id: select
        working-directory: e2e_app
        run: bundle exec fastlane select_e2e_tests

      - uses: actions/upload-artifact@v7
        with:
          name: e2e-selection
          path: e2e_app/build/e2e_selection.json

  allure_launch_android:
    needs: select
    if: (github.event_name != 'workflow_dispatch' || inputs.android) && needs.select.outputs.e2e_batches != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      launch_id: ${{ steps.launch.outputs.launch_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/allure-launch
        id: launch
        with:
          working-directory: e2e_app

  allure_launch_ios:
    needs: select
    if: github.event_name == 'workflow_dispatch' && inputs.ios && needs.select.outputs.e2e_batches != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      launch_id: ${{ steps.launch.outputs.launch_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/allure-launch
        id: launch
        with:
          working-directory: e2e_app

  android:
    # Always on pull_request; opt-out via the checkbox on workflow_dispatch.
    if: (github.event_name != 'workflow_dispatch' || inputs.android) && needs.select.outputs.e2e_batches != '[]'
    needs: [select, allure_launch_android]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.select.outputs.e2e_batches) }}
    env:
      ANDROID_API_LEVEL: "36"
      LAUNCH_ID: ${{ needs.allure_launch_android.outputs.launch_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java

      - uses: ./.github/actions/cache-gradle

      - uses: ./.github/actions/setup-ruby
        with:
          working-directory: e2e_app

      - uses: ./.github/actions/setup-flutter

      - uses: ./.github/actions/enable-kvm

      - name: Bootstrap
        run: |
          flutter pub global activate melos
          melos bootstrap

      - uses: actions/download-artifact@v8
        with:
          name: e2e-selection
          path: e2e_app/build

      - name: Run e2e (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          profile: pixel_6
          script: cd e2e_app && bundle exec fastlane run_e2e_test device:emulator-5554 selection:build/e2e_selection.json batch:${{ matrix.batch }} batch_count:${{ strategy.job-total }}

      - name: Attach videos to failed tests
        if: failure()
        working-directory: e2e_app
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          bundle exec fastlane attach_videos

      - name: Upload Allure results
        if: env.LAUNCH_ID != '' && (success() || failure())
        working-directory: e2e_app
        run: bundle exec fastlane allure_upload launch_id:$LAUNCH_ID

      - name: Allure TestOps Launch Removal
        if: env.LAUNCH_ID != '' && cancelled()
        working-directory: e2e_app
        run: bundle exec fastlane allure_launch_removal launch_id:$LAUNCH_ID

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-android-logs-${{ matrix.batch }}
          path: |
            e2e_app/stream-chat-test-mock-server/logs
            e2e_app/build/e2e-test.log

  ios:
    # Only on workflow_dispatch, when the checkbox is ticked.
    if: github.event_name == 'workflow_dispatch' && inputs.ios && needs.select.outputs.e2e_batches != '[]'
    needs: [select, allure_launch_ios]
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.select.outputs.e2e_batches) }}
    env:
      IOS_SIMULATOR_VERSION: "26.2"
      IOS_SIMULATOR_DEVICE: "iPhone 17"
      LAUNCH_ID: ${{ needs.allure_launch_ios.outputs.launch_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcode
        with:
          # Pinned to match the simulator runtimes this job selects.
          xcode-version: '26.2'

      - uses: ./.github/actions/setup-flutter

      - uses: ./.github/actions/setup-ruby
        with:
          working-directory: e2e_app

      - name: Bootstrap
        run: |
          flutter precache --ios
          flutter pub global activate melos
          melos bootstrap

      - uses: actions/download-artifact@v8
        with:
          name: e2e-selection
          path: e2e_app/build

      - name: Run e2e (iOS simulator)
        working-directory: e2e_app
        run: bundle exec fastlane run_e2e_test platform:ios ios:"${{ env.IOS_SIMULATOR_VERSION }}" device:"${{ env.IOS_SIMULATOR_DEVICE }}" selection:build/e2e_selection.json batch:${{ matrix.batch }} batch_count:${{ strategy.job-total }}

      - name: Upload Allure results
        if: env.LAUNCH_ID != '' && (success() || failure())
        working-directory: e2e_app
        run: bundle exec fastlane allure_upload launch_id:$LAUNCH_ID

      - name: Allure TestOps Launch Removal
        if: env.LAUNCH_ID != '' && cancelled()
        working-directory: e2e_app
        run: bundle exec fastlane allure_launch_removal launch_id:$LAUNCH_ID

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-ios-logs-${{ matrix.batch }}
          path: |
            e2e_app/stream-chat-test-mock-server/logs
            e2e_app/build/e2e-test.log

  # The single required check for E2E: the batch count follows the selection, so
  # the per-batch job names come and go.
  result:
    name: E2E result
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [select, allure_launch_android, allure_launch_ios, android, ios]
    permissions: {}
    steps:
      - name: Fail if an E2E job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
