name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      android:
        description: "Run Android e2e tests"
        type: boolean
        default: true
      ios:
        description: "Run iOS e2e tests"
        type: boolean
        default: false
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_PR_NUM: ${{ github.event.pull_request.number }}
  # The Android emulator, shared by the snapshot job and the test batches. aosp_atd is the
  # Automated Test Device image: no apps or services a test doesn't need, so less post-boot CPU
  # churn.
  ANDROID_API_LEVEL: "36"
  ANDROID_TARGET: aosp_atd
  ANDROID_PROFILE: pixel_6
  ANDROID_CORES: "4"
  # The runner's defaults minus -no-snapshot, plus -no-metrics: it answers the metrics prompt a
  # future emulator release will block on. The test batches add -no-snapshot-save, so every batch
  # boots from the same clean snapshot; the snapshot job leaves it out, so the emulator saves one on
  # exit.
  ANDROID_EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics

jobs:
  select:
    # Pull requests run the tests their changes can reach, per the nightly coverage map.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # downloads the e2e-coverage-map artifact
    outputs:
      e2e_batches: ${{ steps.select.outputs.e2e_batches }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the pull request merge commit and its base

      - uses: ./.github/actions/setup-ruby
        with:
          working-directory: e2e_app

      - name: Select e2e tests
        id: select
        working-directory: e2e_app
        run: bundle exec fastlane select_e2e_tests

      - uses: actions/upload-artifact@v7
        with:
          name: e2e-selection
          path: e2e_app/build/e2e_selection.json

  allure_launch_android:
    needs: select
    if: (github.event_name != 'workflow_dispatch' || inputs.android) && needs.select.outputs.e2e_batches != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      launch_id: ${{ steps.launch.outputs.launch_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/allure-launch
        id: launch
        with:
          working-directory: e2e_app

  allure_launch_ios:
    needs: select
    if: github.event_name == 'workflow_dispatch' && inputs.ios && needs.select.outputs.e2e_batches != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      launch_id: ${{ steps.launch.outputs.launch_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/allure-launch
        id: launch
        with:
          working-directory: e2e_app

  # Boots the emulator once, lets it settle and caches the AVD with its quick-boot snapshot. The
  # batches don't wait for it: they boot from the snapshot when it's cached, and cold boot as before
  # when it isn't yet (the first run after an emulator or image update).
  android_avd:
    if: (github.event_name != 'workflow_dispatch' || inputs.android) && needs.select.outputs.e2e_batches != '[]'
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/enable-kvm

      - uses: ./.github/actions/android-sdk-packages
        id: sdk
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          profile: ${{ env.ANDROID_PROFILE }}
          cores: ${{ env.ANDROID_CORES }}
          emulator-options: ${{ env.ANDROID_EMULATOR_OPTIONS }}

      - name: Look up the AVD
        id: avd
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.sdk.outputs.avd-key }}
          lookup-only: true

      - name: Create the AVD and its snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: x86_64
          profile: ${{ env.ANDROID_PROFILE }}
          cores: ${{ env.ANDROID_CORES }}
          force-avd-creation: false
          emulator-options: ${{ env.ANDROID_EMULATOR_OPTIONS }}
          disable-animations: true
          # Lets the post-boot work (dexopt) finish, so the snapshot holds a settled system. Each
          # line runs on its own.
          script: |
            "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell cmd package bg-dexopt-job > /dev/null 2>&1 || true
            sleep 30

      - name: Save the AVD
        if: steps.avd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.sdk.outputs.avd-key }}

  android:
    # Always on pull_request; opt-out via the checkbox on workflow_dispatch.
    if: (github.event_name != 'workflow_dispatch' || inputs.android) && needs.select.outputs.e2e_batches != '[]'
    needs: [select, allure_launch_android]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.select.outputs.e2e_batches) }}
    env:
      LAUNCH_ID: ${{ needs.allure_launch_android.outputs.launch_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java

      - uses: ./.github/actions/cache-gradle

      - uses: ./.github/actions/setup-ruby
        with:
          working-directory: e2e_app

      - uses: ./.github/actions/setup-flutter

      - uses: ./.github/actions/install-android-ndk

      - uses: ./.github/actions/enable-kvm

      - name: Install Tools
        uses: ./.github/actions/install-tools

      - name: Bootstrap
        run: melos bootstrap

      - uses: actions/download-artifact@v8
        with:
          name: e2e-selection
          path: e2e_app/build

      # The key comes from this runner's own installs: if the emulator was updated since the
      # snapshot was saved, the lookup misses and the batch cold boots instead of loading a stale one.
      - uses: ./.github/actions/android-sdk-packages
        id: sdk
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          profile: ${{ env.ANDROID_PROFILE }}
          cores: ${{ env.ANDROID_CORES }}
          emulator-options: ${{ env.ANDROID_EMULATOR_OPTIONS }}

      - name: Restore the AVD
        id: avd
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.sdk.outputs.avd-key }}

      - name: Run e2e (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # A dead emulator is restarted by the run_e2e_test lane with these options, so it comes
          # back from the snapshot too.
          E2E_EMULATOR_OPTIONS: -no-snapshot-save ${{ env.ANDROID_EMULATOR_OPTIONS }}
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: x86_64
          profile: ${{ env.ANDROID_PROFILE }}
          cores: ${{ env.ANDROID_CORES }}
          # Reuses a restored AVD and its snapshot; creates one when there is none.
          force-avd-creation: ${{ steps.avd.outputs.cache-hit != 'true' }}
          emulator-options: -no-snapshot-save ${{ env.ANDROID_EMULATOR_OPTIONS }}
          script: cd e2e_app && bundle exec fastlane run_e2e_test device:emulator-5554 selection:build/e2e_selection.json batch:${{ matrix.batch }} batch_count:${{ strategy.job-total }}

      - name: Attach videos to failed tests
        if: failure()
        # Videos only help debugging: a slow apt mirror (19 min once) must not hold the job.
        timeout-minutes: 5
        continue-on-error: true
        working-directory: e2e_app
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          bundle exec fastlane attach_videos

      - name: Upload Allure results
        if: env.LAUNCH_ID != '' && (success() || failure())
        working-directory: e2e_app
        run: bundle exec fastlane allure_upload launch_id:$LAUNCH_ID

      - name: Allure TestOps Launch Removal
        if: env.LAUNCH_ID != '' && cancelled()
        working-directory: e2e_app
        run: bundle exec fastlane allure_launch_removal launch_id:$LAUNCH_ID

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-android-logs-${{ matrix.batch }}
          path: |
            e2e_app/stream-chat-test-mock-server/logs
            e2e_app/build/e2e-test.log

  ios:
    # Only on workflow_dispatch, when the checkbox is ticked.
    if: github.event_name == 'workflow_dispatch' && inputs.ios && needs.select.outputs.e2e_batches != '[]'
    needs: [select, allure_launch_ios]
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.select.outputs.e2e_batches) }}
    env:
      IOS_SIMULATOR_VERSION: "26.2"
      IOS_SIMULATOR_DEVICE: "iPhone 17"
      LAUNCH_ID: ${{ needs.allure_launch_ios.outputs.launch_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcode
        with:
          # Pinned to match the simulator runtimes this job selects.
          xcode-version: '26.2'

      - uses: ./.github/actions/setup-flutter

      - uses: ./.github/actions/setup-ruby
        with:
          working-directory: e2e_app

      - name: Install Tools
        uses: ./.github/actions/install-tools

      - name: Bootstrap
        run: |
          flutter precache --ios
          melos bootstrap

      - uses: actions/download-artifact@v8
        with:
          name: e2e-selection
          path: e2e_app/build

      - name: Run e2e (iOS simulator)
        working-directory: e2e_app
        run: bundle exec fastlane run_e2e_test platform:ios ios:"${{ env.IOS_SIMULATOR_VERSION }}" device:"${{ env.IOS_SIMULATOR_DEVICE }}" selection:build/e2e_selection.json batch:${{ matrix.batch }} batch_count:${{ strategy.job-total }}

      - name: Upload Allure results
        if: env.LAUNCH_ID != '' && (success() || failure())
        working-directory: e2e_app
        run: bundle exec fastlane allure_upload launch_id:$LAUNCH_ID

      - name: Allure TestOps Launch Removal
        if: env.LAUNCH_ID != '' && cancelled()
        working-directory: e2e_app
        run: bundle exec fastlane allure_launch_removal launch_id:$LAUNCH_ID

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-ios-logs-${{ matrix.batch }}
          path: |
            e2e_app/stream-chat-test-mock-server/logs
            e2e_app/build/e2e-test.log

  # The single required check for E2E: the batch count follows the selection, so
  # the per-batch job names come and go.
  result:
    name: E2E result
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [select, allure_launch_android, allure_launch_ios, android, ios]
    permissions: {}
    steps:
      - name: Fail if an E2E job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
