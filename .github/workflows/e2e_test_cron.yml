name: E2E Tests Nightly

on:
  schedule:
    - cron: "0 1 * * 1-5"
  workflow_dispatch:
    inputs:
      mock_server_branch:
        description: "Mock server branch"
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  mock_server_branch: ${{ github.event.inputs.mock_server_branch || 'main' }}
  ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # Coverage runs every test in its own app process for the map that selects e2e tests on
          # pull requests. That takes hours, longer than a hosted runner lasts under the emulator's
          # load, so its tests are split across batches. coverage_map's batch_count must match.
          - { api-level: 36, coverage: true, batch: 0, batch_count: 4 }
          - { api-level: 36, coverage: true, batch: 1, batch_count: 4 }
          - { api-level: 36, coverage: true, batch: 2, batch_count: 4 }
          - { api-level: 36, coverage: true, batch: 3, batch_count: 4 }
          - { api-level: 34, batch: 0, batch_count: 1 }
          - { api-level: 31, batch: 0, batch_count: 1 }
          - { api-level: 28, batch: 0, batch_count: 1 }
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java

      - uses: ./.github/actions/cache-gradle

      - uses: ./.github/actions/setup-ruby
        with:
          working-directory: e2e_app

      - uses: ./.github/actions/setup-flutter

      - uses: ./.github/actions/enable-kvm

      - name: Bootstrap
        run: |
          flutter pub global activate melos
          melos bootstrap

      - name: Launch Allure TestOps
        working-directory: e2e_app
        run: bundle exec fastlane allure_launch cron:true

      - name: Run e2e (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: cd e2e_app && bundle exec fastlane run_e2e_test device:emulator-5554 coverage:${{ matrix.coverage == true }} batch:${{ matrix.batch }} batch_count:${{ matrix.batch_count }} mock_server_branch:${{ env.mock_server_branch }}

      # A tarball, as upload-artifact rejects some characters a test name (the folder name) may hold.
      - name: Pack the coverage
        if: matrix.coverage && !cancelled()
        working-directory: e2e_app/build
        run: tar -czf e2e-coverage-batch-${{ matrix.batch }}.tgz e2e-coverage

      - uses: actions/upload-artifact@v7
        if: matrix.coverage && !cancelled()
        with:
          name: e2e-coverage-batch-${{ matrix.batch }}
          path: e2e_app/build/e2e-coverage-batch-${{ matrix.batch }}.tgz
          retention-days: 3

      - name: Attach videos to failed tests
        if: failure()
        # Videos only help debugging: a slow apt mirror (19 min once) must not hold the job.
        timeout-minutes: 5
        continue-on-error: true
        working-directory: e2e_app
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          bundle exec fastlane attach_videos

      - name: Upload Allure results
        if: env.LAUNCH_ID != '' && (success() || failure())
        working-directory: e2e_app
        run: bundle exec fastlane allure_upload launch_id:$LAUNCH_ID

      - name: Allure TestOps Launch Removal
        if: env.LAUNCH_ID != '' && cancelled()
        working-directory: e2e_app
        run: bundle exec fastlane allure_launch_removal launch_id:$LAUNCH_ID

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-nightly-android-${{ matrix.api-level }}-batch-${{ matrix.batch }}
          path: |
            e2e_app/stream-chat-test-mock-server/logs
            e2e_app/build/e2e-test.log

  coverage_map:
    needs: android
    # Failed tests keep their previous coverage; only a batch that never finished blocks the map.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # downloads the previous map, for the coverage of failed tests
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ruby
        with:
          working-directory: e2e_app

      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-coverage-batch-*
          path: e2e_app/build/batches
          merge-multiple: true

      - name: Merge the batches
        working-directory: e2e_app/build
        run: |
          shopt -s nullglob
          for batch in batches/*.tgz; do tar -xzf "$batch"; done

      - name: Build the coverage map
        working-directory: e2e_app
        run: bundle exec fastlane build_e2e_coverage_map batch_count:4

      - uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage-map
          path: e2e_app/build/e2e_coverage_map.json
          retention-days: 14

  ios:
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: "26.2"
            device: "iPhone 17 Pro"
            setup_runtime: false
          - ios: "17.5"
            device: "iPhone 15 Pro"
            setup_runtime: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcode
        with:
          # Pinned to match the simulator runtimes this job selects.
          xcode-version: '26.2'

      - uses: ./.github/actions/setup-ruby
        with:
          working-directory: e2e_app

      - uses: ./.github/actions/setup-flutter

      - uses: ./.github/actions/setup-ios-runtime
        if: ${{ matrix.setup_runtime }}
        with:
          version: ${{ matrix.ios }}
          device: ${{ matrix.device }}

      - name: Bootstrap
        run: |
          flutter precache --ios
          flutter pub global activate melos
          melos bootstrap

      - name: Launch Allure TestOps
        working-directory: e2e_app
        run: bundle exec fastlane allure_launch cron:true

      - name: Run e2e (iOS simulator)
        working-directory: e2e_app
        run: bundle exec fastlane run_e2e_test platform:ios ios:${{ matrix.ios }} device:"${{ matrix.device }} (${{ matrix.ios }})" mock_server_branch:${{ env.mock_server_branch }}

      - name: Upload Allure results
        if: env.LAUNCH_ID != '' && (success() || failure())
        working-directory: e2e_app
        run: bundle exec fastlane allure_upload launch_id:$LAUNCH_ID

      - name: Allure TestOps Launch Removal
        if: env.LAUNCH_ID != '' && cancelled()
        working-directory: e2e_app
        run: bundle exec fastlane allure_launch_removal launch_id:$LAUNCH_ID

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-nightly-ios-${{ matrix.ios }}
          path: |
            e2e_app/stream-chat-test-mock-server/logs
            e2e_app/build/e2e-test.log

  slack:
    name: Slack Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [android, coverage_map, ios]
    if: failure() && github.event_name == 'schedule'
    steps:
      - uses: 8398a7/action-slack@v3
        with:
          status: cancelled
          text: "You shall not pass!"
          job_name: "${{ github.workflow }}: ${{ github.job }}"
          fields: repo,commit,author,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_NIGHTLY_CHECKS }}
