name: check_db_entities

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Centralizes every gating decision for this workflow — currently just a
  # path filter. Downstream jobs only need a single
  # `if: needs.gate.outputs.should_run == 'true'`. A job skipped this way
  # reports `success` to branch protection (vs. `on.paths` filtering, which
  # hangs forever) — see
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  gate:
    runs-on:
      group: github-public-amd64
    outputs:
      should_run: ${{ steps.filter.outputs.persistence }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🛤️ Detect Path Changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            persistence:
              - 'packages/stream_chat_persistence/**'
              - '.github/workflows/check_db_entities.yml'

  # Decides whether the check passes: it fails when entity files changed and
  # `schemaVersion` was not bumped. The comment is left to `comment`, so a
  # comment that cannot be handed over or posted never fails the check.
  check_entity_modifications:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      has_comment: ${{ steps.upload_comment.outcome == 'success' }}
    steps:
      # Anonymous checkout: the org IP allow list refuses only signed-in API and git requests, and
      # this job makes neither, so it runs on a free standard runner. The artifact upload goes to
      # the Actions artifact service, which the allow list does not refuse.
      - name: 📥 Checkout
        run: |
          git init -q .
          git remote add origin "https://github.com/$REPOSITORY"
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' "$SHA"
          git checkout -q --detach "$SHA"
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}

      - name: 🔎 Check DB Entity Changes
        id: check_entities
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./.github/workflows/scripts/check-db-entities.sh

      - name: 📝 Write Job Summary
        if: steps.check_entities.outputs.has_changes == 'true'
        run: cat comment_body.md >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload Comment Body
        id: upload_comment
        if: steps.check_entities.outputs.has_changes == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: db-entities-comment
          path: comment_body.md
          if-no-files-found: error

      - name: 🚨 Enforce schema version bump
        if: steps.check_entities.outputs.has_changes == 'true' && steps.check_entities.outputs.version_bumped == 'false'
        run: |
          echo "::error file=packages/stream_chat_persistence/lib/src/db/drift_chat_database.dart::Database entity files were modified but \`schemaVersion\` was not bumped. See the job summary for the suggested change."
          exit 1

  # Posts the comment `check_entity_modifications` uploaded, also when that
  # job failed on a missing version bump. Commenting is a signed-in GitHub
  # call, which the org IP allow list refuses from a standard runner, so this
  # job runs in the org runner group. Fork pull requests get a read-only
  # token: they skip the comment and read the suggested change in the job
  # summary instead.
  comment:
    needs: check_entity_modifications
    if: >-
      !cancelled()
      && needs.check_entity_modifications.outputs.has_comment == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    runs-on:
      group: github-public-amd64
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: 📥 Download Comment Body
        uses: actions/download-artifact@v8
        with:
          name: db-entities-comment

      - name: 🔍 Find Comment
        uses: peter-evans/find-comment@v4
        id: find_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Database Entity Files Modified

      - name: 💬 Create or Update Comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: comment_body.md
          edit-mode: replace
