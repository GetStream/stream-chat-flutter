name: stream_flutter_workflow

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - master

# Each master push gets its own group, so no run is cancelled or replaced
# while pending: every master commit needs a full Codecov upload for pull
# requests to carry skipped packages' coverage from.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Centralizes every gating decision for this workflow — path filter,
  # draft state, and push-vs-PR semantics. Downstream jobs only need a
  # single `if: needs.gate.outputs.should_run == 'true'`. A job skipped
  # this way reports `success` to branch protection (vs. `on.paths`
  # filtering, which hangs forever) — see
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  #
  # `push` events to master always run the full suite, matching the
  # previous `on.push.branches: [master]` behavior.
  #
  # `test_all` tells `select` to test every package: on master pushes, and
  # when a `shared` file that every package builds or tests against changed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name == 'push' || (steps.filter.outputs.relevant == 'true' && github.event.pull_request.draft != true) }}
      test_all: ${{ github.event_name == 'push' || steps.filter.outputs.shared == 'true' }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🛤️ Detect Path Changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'melos.yaml'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'codecov.yml'
              - 'tools/**'
              - '.github/actions/**'
              - '.github/workflows/scripts/**'
              - '.github/workflows/stream_flutter_workflow.yml'
            relevant:
              - *shared
              - 'docs/**'
              - 'packages/**'
              - 'sample_app/**'
              - 'e2e_app/**'

  analyze:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🐦 Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: 📦 Install Tools
        uses: ./.github/actions/setup-melos

      - name: 🔧 Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: 🔍 Dart Analyze
        run: melos run analyze

      - name: 📋 Pub Check
        if: github.base_ref == 'master'
        run: melos run lint:pub

  format:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🐦 Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: 📦 Install Tools
        uses: ./.github/actions/setup-melos

      - name: 🔧 Bootstrap Workspace
        run: melos bootstrap

      - name: 🎨 Melos Format
        run: melos run format

      - name: ✅ Validate Formatting
        run: ./.github/workflows/scripts/validate-formatting.sh

  # Picks the packages to test, with their minimum coverage. On pull requests
  # that is the changed packages and their dependents; pushes to master and
  # changes to shared files test every package.
  select:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🐦 Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: 📦 Install Tools
        uses: ./.github/actions/setup-melos

      - name: 🔧 Bootstrap Workspace
        run: melos bootstrap

      # Every package with tests must be in the table, or it would never be
      # tested. A pull request checks out its merge commit, whose first parent
      # is the base branch commit it merged onto. An empty melos selection
      # tests every package rather than none.
      - name: 🎯 Select Packages
        id: select
        env:
          TEST_ALL: ${{ needs.gate.outputs.test_all }}
          PACKAGES: |
            [
              { "package": "stream_chat", "path": "packages/stream_chat", "min-coverage": 70 },
              { "package": "stream_chat_flutter", "path": "packages/stream_chat_flutter", "min-coverage": 44 },
              { "package": "stream_chat_flutter_core", "path": "packages/stream_chat_flutter_core", "min-coverage": 30 },
              { "package": "stream_chat_localizations", "path": "packages/stream_chat_localizations", "min-coverage": 100 },
              { "package": "stream_chat_persistence", "path": "packages/stream_chat_persistence", "min-coverage": 95 },
              { "package": "sample_app", "path": "sample_app" }
            ]
        run: |
          set -euo pipefail

          tested=$(melos list --dir-exists=test --ignore="docs_*" --json | jq -c 'map(.name)')
          missing=$(jq -r --argjson tested "$tested" '$tested - map(.package) | join(", ")' <<< "$PACKAGES")
          if [ -n "$missing" ]; then
            echo "::error::Add these packages to the PACKAGES table: $missing"
            exit 1
          fi

          selected=$(jq -c . <<< "$PACKAGES")
          if [ "$TEST_ALL" != "true" ]; then
            changed=$(melos list --diff="$(git rev-parse HEAD^1)" --include-dependents --json | jq -c 'map(.name)')
            if [ "$changed" != "[]" ]; then
              selected=$(jq -c --argjson changed "$changed" 'map(select(.package | IN($changed[])))' <<< "$PACKAGES")
            fi
          fi

          echo "packages=$selected" >> "$GITHUB_OUTPUT"
          echo "Testing: $(jq -r 'map(.package) | join(", ")' <<< "$selected")" >> "$GITHUB_STEP_SUMMARY"

  test-package:
    name: test (${{ matrix.package }})
    needs: select
    if: needs.select.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Codecov authenticates the coverage upload with a GitHub OIDC token.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.packages) }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🐦 Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: 📦 Install Melos
        uses: ./.github/actions/setup-melos

      - name: 📦 Install Tools
        run: flutter pub global activate remove_from_coverage

      - name: 🔧 Bootstrap Workspace
        run: melos bootstrap

      - name: 🧪 Flutter Test
        working-directory: ${{ matrix.path }}
        run: flutter test --coverage

      - name: 🧹 Collect Coverage
        if: matrix.min-coverage
        working-directory: ${{ matrix.path }}
        run: bash "$GITHUB_WORKSPACE/.github/workflows/scripts/remove-from-coverage.sh"

      # Each package uploads under its own flag, so Codecov carries forward
      # the coverage of packages a run skipped. See codecov.yml.
      - name: 📤 Upload Coverage
        if: matrix.min-coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ${{ matrix.path }}/coverage/lcov.info
          disable_search: true
          flags: ${{ matrix.package }}

      - name: 📊 Check Coverage
        if: matrix.min-coverage
        uses: VeryGoodOpenSource/very_good_coverage@v3.0.0
        with:
          path: ${{ matrix.path }}/coverage/lcov.info
          min_coverage: ${{ matrix.min-coverage }}

  # The required check. It fails when any selected package's tests fail or a
  # job before them fails, and passes when no package needed testing.
  test:
    needs: [gate, select, test-package]
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.should_run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: 🚨 Check Results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  build:
    name: build (${{ matrix.platform }})
    needs: gate
    if: needs.gate.outputs.should_run == 'true' && github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            working-directory: sample_app/android
            build-command: bundle exec fastlane build_apk
          # - platform: ios
          #   os: xcode-27
          #   working-directory: sample_app/ios
          #   build-command: bundle exec fastlane build_ipa no_codesign:true
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🐦 Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: 🍎 Setup Xcode
        if: matrix.platform == 'ios'
        uses: ./.github/actions/setup-xcode

      - name: 💾 Cache Gradle
        if: matrix.platform == 'android'
        uses: ./.github/actions/cache-gradle

      - name: 🤖 Install Android NDK
        if: matrix.platform == 'android'
        uses: ./.github/actions/install-android-ndk

      - name: 📦 Install Tools
        uses: ./.github/actions/setup-melos

      - name: 🔧 Bootstrap Workspace
        run: melos bootstrap

      - name: 💎 Setup Ruby
        uses: ./.github/actions/setup-ruby

      - name: 🏗️ Build ${{ matrix.platform }} App
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.build-command }}
