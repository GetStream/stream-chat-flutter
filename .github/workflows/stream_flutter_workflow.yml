name: stream_flutter_workflow

env:
  ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - master

# Master runs are never cancelled: each master commit needs a full Codecov
# upload for pull requests to carry skipped packages' coverage from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Centralizes every gating decision for this workflow — path filter,
  # draft state, and push-vs-PR semantics. Downstream jobs only need a
  # single `if: needs.gate.outputs.should_run == 'true'`. A job skipped
  # this way reports `success` to branch protection (vs. `on.paths`
  # filtering, which hangs forever) — see
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  #
  # `push` events to master always run the full suite, matching the
  # previous `on.push.branches: [master]` behavior.
  #
  # On pull requests the test job only runs the changed packages and their
  # dependents, unless a `shared` file changed: every package builds or
  # tests against those, so they run the full suite.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name == 'push' || (steps.filter.outputs.relevant == 'true' && github.event.pull_request.draft != true) }}
      test_all: ${{ github.event_name == 'push' || steps.filter.outputs.shared == 'true' }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Detect Path Changes"
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'melos.yaml'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'codecov.yml'
              - 'tools/**'
              - '.github/actions/**'
              - '.github/workflows/scripts/**'
              - '.github/workflows/stream_flutter_workflow.yml'
            relevant:
              - *shared
              - 'docs/**'
              - 'packages/**'
              - 'sample_app/**'
              - 'e2e_app/**'

  analyze:
    needs: gate
    timeout-minutes: 15
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: "Install Tools"
        run: |
          flutter pub global activate melos
      - name: "Bootstrap Workspace"
        run: melos bootstrap --verbose
      - name: "Dart Analyze"
        run: |
          melos run analyze
      - name: "Pub Check"
        if: github.base_ref == 'master'
        run: |
          melos run lint:pub

  format:
    needs: gate
    runs-on: ubuntu-latest
    if: needs.gate.outputs.should_run == 'true'
    timeout-minutes: 15
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: "Install Tools"
        run: |
          flutter pub global activate melos
      - name: "Bootstrap Workspace"
        run: melos bootstrap
      - name: "Melos Format"
        run: melos run format
      - name: "Validate Formatting"
        run: |
          ./.github/workflows/scripts/validate-formatting.sh

  test:
    needs: gate
    runs-on: ubuntu-latest
    if: needs.gate.outputs.should_run == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
      # Codecov authenticates the coverage upload with a GitHub OIDC token.
      id-token: write
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      # This step is needed due to https://github.com/actions/runner-images/issues/11279
      - name: Install SQLite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev
      - name: "Install Tools"
        run: |
          flutter pub global activate melos
          flutter pub global activate remove_from_coverage
      - name: "Bootstrap Workspace"
        run: melos bootstrap
      # A pull request checks out its merge commit, whose first parent is the
      # base branch commit it merged onto. Melos only runs scripts in the
      # packages listed in MELOS_PACKAGES, on top of each script's own
      # filters. It stays unset, and the full suite runs, when no package
      # changed.
      - name: "Select Changed Packages"
        if: needs.gate.outputs.test_all != 'true'
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD^1)
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          packages=$(melos list --diff="$base" --include-dependents --json | jq -r '.[].name' | paste -sd, -)
          if [ -z "$packages" ]; then
            echo "No package changed, testing all packages." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "MELOS_PACKAGES=$packages" >> "$GITHUB_ENV"
          echo "Changed packages and their dependents: ${packages//,/, }." >> "$GITHUB_STEP_SUMMARY"
      - name: "Flutter Test"
        run: melos run test:all
      - name: "Collect Coverage"
        run: melos run coverage:ignore-file --no-select
      - name: "Stream Chat Coverage"
        uses: ./.github/actions/package-coverage
        with:
          package: stream_chat
          base-sha: ${{ env.BASE_SHA }}
          min-coverage: 70
      - name: "Stream Chat Localizations Coverage"
        uses: ./.github/actions/package-coverage
        with:
          package: stream_chat_localizations
          base-sha: ${{ env.BASE_SHA }}
          min-coverage: 100
      - name: "Stream Chat Persistence Coverage"
        uses: ./.github/actions/package-coverage
        with:
          package: stream_chat_persistence
          base-sha: ${{ env.BASE_SHA }}
          min-coverage: 95
      - name: "Stream Chat Flutter Core Coverage"
        uses: ./.github/actions/package-coverage
        with:
          package: stream_chat_flutter_core
          base-sha: ${{ env.BASE_SHA }}
          min-coverage: 30
      - name: "Stream Chat Flutter Coverage"
        uses: ./.github/actions/package-coverage
        with:
          package: stream_chat_flutter
          base-sha: ${{ env.BASE_SHA }}
          min-coverage: 44

  build:
    name: build (${{ matrix.platform }})
    needs: gate
    runs-on: ${{ matrix.os }}
    if: needs.gate.outputs.should_run == 'true' && github.event_name == 'pull_request'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            working-directory: sample_app/android
            build-command: bundle exec fastlane build_apk
          # - platform: ios
          #   os: xcode-27
          #   working-directory: sample_app/ios
          #   build-command: bundle exec fastlane build_ipa no_codesign:true

    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/setup-xcode
        if: matrix.platform == 'ios'
      - uses: ./.github/actions/cache-gradle
        if: matrix.platform == 'android'
      - uses: ./.github/actions/install-android-ndk
        if: matrix.platform == 'android'
      - name: "Install Tools"
        run: flutter pub global activate melos
      - name: "Bootstrap Workspace"
        run: melos bootstrap
      - uses: ./.github/actions/setup-ruby
      - name: "Build ${{ matrix.platform }} App"
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.build-command }}
