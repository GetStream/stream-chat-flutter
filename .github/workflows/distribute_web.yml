name: distribute_web

# Deploys the sample app's web build through the shared workflow in
# stream-core-flutter:
#
#   - every push to master: https://flutter.getstream.io/chat/beta/
#   - a release of the master line: https://flutter.getstream.io/chat/
#   - a manual run: the chosen flavor, from the chosen ref
#
# Releases of older lines (v9) are skipped: a release is the master line when
# its major matches the version of packages/stream_chat on master.

on:
  push:
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      flavor:
        description: Build flavor
        type: choice
        options:
          - beta
          - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flavor:
    name: Pick Flavor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flavor: ${{ steps.flavor.outputs.flavor }}
    steps:
      - name: Pick Flavor
        id: flavor
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_FLAVOR: ${{ inputs.flavor }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case $EVENT in
            push) flavor=beta ;;
            workflow_dispatch) flavor=$INPUT_FLAVOR ;;
            release)
              master=$(gh api "repos/$GITHUB_REPOSITORY/contents/packages/stream_chat/pubspec.yaml?ref=master" \
                --jq .content | base64 -d | sed -nE 's/^version:[[:space:]]*["'\'']?([0-9]+)\..*/\1/p')
              if [[ -z $master ]]; then
                echo "::error::No version found in packages/stream_chat/pubspec.yaml on master"
                exit 1
              fi
              if [[ $TAG =~ ^v([0-9]+)\. && ${BASH_REMATCH[1]} == "$master" ]]; then
                flavor=prod
              else
                echo "$TAG is not a release of the master line (v$master), skipping"
                flavor=
              fi
              ;;
          esac
          echo "flavor=$flavor" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to flutter.getstream.io
    needs: flavor
    if: needs.flavor.outputs.flavor != ''
    permissions:
      contents: read
      id-token: write
    uses: GetStream/stream-core-flutter/.github/workflows/web_deploy.yml@ci/shared-web-deploy
    with:
      app: chat
      flavor: ${{ needs.flavor.outputs.flavor }}
      working-directory: sample_app
      bootstrap: true
