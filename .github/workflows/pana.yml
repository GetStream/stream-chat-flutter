name: pana

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  stream_chat:
    runs-on: ubuntu-latest
    steps:
      # Anonymous checkout: the org IP allow list refuses only signed-in requests, and this job
      # makes no other GitHub call, so it runs on a free standard runner.
      - name: 📚 Git Checkout
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "https://github.com/$REPOSITORY" "$SHA"
          git checkout -q FETCH_HEAD
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
      - name: 📊 Verify Pana Score
        uses: ./.github/actions/pana
        with:
          working_directory: packages/stream_chat
          min_score: 100

  stream_chat_persistence:
