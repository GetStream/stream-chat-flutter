name: pana

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  stream_chat:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
      - name: 📊 Verify Pana Score
        uses: ./.github/actions/pana
        with:
          working_directory: packages/stream_chat
          min_score: 100

  stream_chat_persistence:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
      - name: 📊 Verify Pana Score
        uses: ./.github/actions/pana
        with:
          working_directory: packages/stream_chat_persistence
          min_score: 100

  stream_chat_flutter_core:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
      - name: 📊 Verify Pana Score
        uses: ./.github/actions/pana
        with:
          working_directory: packages/stream_chat_flutter_core
          min_score: 100

  # Disabled while `stream_core` is a git dependency. pana resolves each package
  # standalone, without the dependency_overrides melos generates, so any package
  # pulling both `stream_chat` (git stream_core) and `stream_core_flutter`
  # (hosted stream_core) fails version solving before pana can score it. The
  # other packages still run — `stream_chat` alone resolves fine.
  #
  # Re-enable both jobs once stream_core is published; see
  # openapi-migration/01-foundation.md.
  stream_chat_flutter:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
      - name: 📊 Verify Pana Score
        uses: ./.github/actions/pana
        with:
          working_directory: packages/stream_chat_flutter
          min_score: 100

  # Disabled while `stream_core` is a git dependency. pana resolves each package
  # standalone, without the dependency_overrides melos generates, so any package
  # pulling both `stream_chat` (git stream_core) and `stream_core_flutter`
  # (hosted stream_core) fails version solving before pana can score it. The
  # other packages still run — `stream_chat` alone resolves fine.
  #
  # Re-enable both jobs once stream_core is published; see
  # openapi-migration/01-foundation.md.
  stream_chat_localizations:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
      - name: 📊 Verify Pana Score
        uses: ./.github/actions/pana
        with:
          working_directory: packages/stream_chat_localizations
          min_score: 100