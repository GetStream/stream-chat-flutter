name: update_goldens

on: workflow_dispatch

jobs:
  update_goldens:
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Mint CI Bot Token
        id: ci-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}

      - name: 📚 Checkout branch
        uses: actions/checkout@v6

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Install Tools
        run: flutter pub global activate melos

      - name: 🔧 Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: 🖼️ Update Goldens
        continue-on-error: true
        run: melos run update:goldens

      - name: 📤 Commit Changes
        uses: GetStream/stream-core-flutter/.github/actions/bot-commit@e371bd980d64c744cfd09437c34c1ee1c15c5dc5
        with:
          files: "**/test/**/goldens/**/*.png"
          message: "chore: Update Goldens"
          token: ${{ steps.ci-bot-token.outputs.token }}
