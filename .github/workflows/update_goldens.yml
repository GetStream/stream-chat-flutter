name: update_goldens

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which goldens to update"
        required: true
        type: choice
        default: both
        options:
          - both
          - sdk
          - docs
  # Run by the `/update-goldens` bot command, see bot_commands.yml.
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      ref:
        description: "Branch the goldens are pushed to"
        type: string
        required: true
      sha:
        description: "Commit the goldens are generated from; nothing is pushed if the branch moved past it"
        type: string
        required: true
    outputs:
      message:
        description: "Reply to the command"
        value: ${{ jobs.summarize.outputs.message }}

permissions:
  contents: read

jobs:
  update_sdk_goldens:
    if: inputs.target == 'sdk' || inputs.target == 'both'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      update: ${{ steps.update.outcome }}
    steps:
      - name: 📚 Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: 🐦 Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: 📦 Install Tools
        run: flutter pub global activate melos

      - name: 🔧 Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: 🖼️ Update SDK Goldens
        id: update
        continue-on-error: true
        run: melos run update:goldens:sdk

      - name: 🔍 Detect changed goldens
        id: detect
        run: |
          if [[ -z "$(git status --porcelain -- 'packages/**/test/**/goldens/**/*.png')" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Bundle SDK goldens
        if: steps.detect.outputs.changed == 'true'
        run: |
          find packages -path '*/test/*/goldens/*' -name '*.png' -print0 \
            | tar --null -czf sdk-goldens.tgz -T -

      - name: 📤 Upload SDK goldens artifact
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sdk-goldens
          path: sdk-goldens.tgz
          retention-days: 1

  update_docs_goldens:
    if: inputs.target == 'docs' || inputs.target == 'both'
    runs-on: macos-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      update: ${{ steps.update.outcome }}
    steps:
      - name: 📚 Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: 🐦 Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: 📦 Install Tools
        run: flutter pub global activate melos

      - name: 🔧 Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: 🖼️ Update Docs Goldens
        id: update
        continue-on-error: true
        run: melos run update:goldens:docs

      - name: 🔍 Detect changed goldens
        id: detect
        run: |
          if [[ -z "$(git status --porcelain -- 'docs/**/test/**/goldens/**/*.png')" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Bundle docs goldens
        if: steps.detect.outputs.changed == 'true'
        run: |
          find docs -path '*/test/*/goldens/*' -name '*.png' -print0 \
            | tar --null -czf docs-goldens.tgz -T -

      - name: 📤 Upload docs goldens artifact
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docs-goldens
          path: docs-goldens.tgz
          retention-days: 1

  commit_goldens:
    needs: [update_sdk_goldens, update_docs_goldens]
    # `always()` lets this run even when one regen job was skipped (e.g. target=sdk).
    # We commit only when at least one regen produced actual changes — no diff means
    # no artifact uploaded, so a workflow run with no golden changes ends as a no-op.
    if: |
      always() &&
      (needs.update_sdk_goldens.outputs.changed == 'true' ||
       needs.update_docs_goldens.outputs.changed == 'true')
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit_hash }}
      moved: ${{ steps.verify.outputs.moved }}
    steps:
      - name: 🔑 Mint CI Bot Token
        id: ci-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}

      - name: 📚 Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.ci-bot-token.outputs.token }}

      - name: 🔍 Verify the branch has not moved
        id: verify
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if [[ -n "$SHA" && "$(git rev-parse HEAD)" != "$SHA" ]]; then
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📥 Download SDK goldens
        if: steps.verify.outputs.moved != 'true' && needs.update_sdk_goldens.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: sdk-goldens

      - name: 📥 Download docs goldens
        if: steps.verify.outputs.moved != 'true' && needs.update_docs_goldens.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: docs-goldens

      - name: 📦 Extract goldens
        if: steps.verify.outputs.moved != 'true'
        run: |
          for tgz in sdk-goldens.tgz docs-goldens.tgz; do
            if [[ -f "$tgz" ]]; then
              # The archive comes from the pull request's code, so only goldens are extracted.
              tar -xzf "$tgz" --wildcards --wildcards-match-slash '*/goldens/*.png'
              rm "$tgz"
            fi
          done

      - name: 📤 Commit Changes
        id: commit
        if: steps.verify.outputs.moved != 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: Update Goldens"
          file_pattern: "**/test/**/goldens/**/*.png"
          commit_user_name: "stream-flutter-ci-bot[bot]"
          commit_user_email: "357444665+stream-flutter-ci-bot[bot]@users.noreply.github.com"

  summarize:
    needs: [update_sdk_goldens, update_docs_goldens, commit_goldens]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      message: ${{ steps.summarize.outputs.message }}
    steps:
      - name: 📝 Summarize
        id: summarize
        env:
          COMMIT: ${{ needs.commit_goldens.outputs.commit }}
          MOVED: ${{ needs.commit_goldens.outputs.moved }}
          TESTS_FAILED: ${{ needs.update_sdk_goldens.outputs.update == 'failure' || needs.update_docs_goldens.outputs.update == 'failure' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tests_note="some golden tests failed to run, see the [run]($RUN)."
          if [[ "$MOVED" == "true" ]]; then
            message="The branch moved while the goldens were updating, so nothing was pushed. Run the command again."
          elif [[ -n "$COMMIT" && "$TESTS_FAILED" == "true" ]]; then
            message="Updated the goldens in $COMMIT, but $tests_note"
          elif [[ -n "$COMMIT" ]]; then
            message="Updated the goldens in $COMMIT."
          elif [[ "$TESTS_FAILED" == "true" ]]; then
            message="No goldens changed, but $tests_note"
          else
            message="The goldens are already up to date ([run]($RUN))."
          fi
          echo "message=$message" >> "$GITHUB_OUTPUT"
