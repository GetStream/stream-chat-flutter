name: update_goldens

on: workflow_dispatch

jobs:
  update_goldens:
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Mint CI Bot Token
        id: ci-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}

      - name: 📚 Checkout branch
        uses: actions/checkout@v6
        with:
          token: ${{ steps.ci-bot-token.outputs.token }}

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Install Tools
        run: flutter pub global activate melos

      - name: 🔧 Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: 🖼️ Update Goldens
        continue-on-error: true
        run: melos run update:goldens

      - name: 📤 Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: Update Goldens"
          file_pattern: "**/test/**/goldens/*.png"
          commit_user_name: "stream-flutter-ci-bot[bot]"
          commit_user_email: "357444665+stream-flutter-ci-bot[bot]@users.noreply.github.com"
