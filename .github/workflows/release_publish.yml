name: release_publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # tag-pattern for regular releases
      - 'v[0-9]+.[0-9]+.[0-9]+-*' # tag-pattern for pre-releases
  workflow_dispatch: # Allow manual triggering of the workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # Publishing waits for a flutter-developers approval, and pub.dev only
    # accepts uploads from this environment.
    environment: pub.dev
    permissions:
      contents: write  # Required to creating release
      id-token: write # Required for authentication using OIDC
    runs-on:
      group: github-public-amd64
    steps:
      - name: 🔑 Mint CI Bot Token
        id: ci-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}

      - name: 📚 Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.ci-bot-token.outputs.token }}

      # Set up the Dart SDK and provision the OIDC token used for publishing.
      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: 🐦 Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: 📦 Install Tools
        uses: ./.github/actions/install-tools

      - name: 🔧 Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: 🌵 Dry Run
        run: melos run lint:pub

      - name: 📢 Release to pub.dev
        run: melos run release:pub

      - name: 🏷️ Extract Version Info
        id: extract_version
        shell: bash
        run: |
          set -euo pipefail
          
          tag_name="${{ github.ref_name }}"
          echo "📦 Tag: $tag_name"
          
          # Check if this is a pre-release (contains hyphen after version)
          is_prerelease=$([[ $tag_name == *-* ]] && echo true || echo false)
          echo "ℹ️ Pre-release: $is_prerelease"
          
          echo "tag=$tag_name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ steps.extract_version.outputs.tag }}
          prerelease: ${{ steps.extract_version.outputs.prerelease }}
          token: ${{ steps.ci-bot-token.outputs.token }}