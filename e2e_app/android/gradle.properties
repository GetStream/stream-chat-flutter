# Same as sample_app. The template's 8G heap (+4G metaspace) left too little of a CI
# runner's 16 GB for the emulator, which hung during builds.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
# Kotlin compiles inside the Gradle daemon. A separate Kotlin daemon inherits the heap above,
# doubling what the builds can take next to the emulator.
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
