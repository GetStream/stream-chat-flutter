name: docs_screenshots
description: Golden test screenshots for Stream Chat Flutter documentation.
publish_to: none

# Note: The environment configuration and dependency versions are managed by Melos.
#
# Do not edit them manually.
#
# Steps to update dependencies:
#   1. Modify the version in the melos.yaml file.
#   2. Run `melos bootstrap` to apply changes.

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  record: ^6.2.0
  stream_chat_flutter: ^10.4.0
  stream_core_flutter:
    git:
      url: https://github.com/GetStream/stream-core-flutter.git
      ref: 04e0d1cb3a6893cf70cb6636a261deb11beff81c
      path: packages/stream_core_flutter

dev_dependencies:
  alchemist: ^0.14.0
  device_preview: ^1.2.0
  emojis: ^0.9.9
  flutter_slidable: ^4.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  stream_chat_localizations: ^10.0.0-beta.13
  substring_highlight: ^1.0.33

flutter:
  uses-material-design: true

dependency_overrides:
  # Forces one source for `stream_core`; see `melos.yaml`.
  # TODO(ws-migration): move to a ref on `main` once GetStream/stream-core-flutter#186 merges.
  # Repeated here because this block outranks `melos.yaml`'s `dependencyOverridePaths`.
  stream_core:
    git:
      url: https://github.com/GetStream/stream-core-flutter.git
      path: packages/stream_core
      ref: 366b34a5bf7b5387db658669392ec23f9e4cda4d
